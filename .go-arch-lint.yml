# Architecture rules for the Go rewrite, mirroring .dependency-cruiser.cjs rule names.
# Checked by `make go-arch-lint` and by internal/archtest, which runs this very file against one
# failing fixture per rule. A rule without a failing fixture does not count.
#
# Enforced elsewhere:
#   domain-is-pure (standard library part)  internal/archtest ImpureDomainImports
#   deps-only-in-infra (stdlib crypto, and a second line for vendors)  depguard in .golangci.yml
#   schema ownership                        internal/archtest ForeignSchemaRefs
#   no-circular                             the Go compiler
#
# Rules expressed here:
#   domain-is-pure          domain imports only its own domain and internal/kernel
#   application-only-domain app imports its own domain and app, kernel and the root package of
#                           other modules
#   no-inward-infra         domain and app never import infra, http or platform
#   deps-only-in-infra      pgx, go-oidc, x/oauth2 and ONNX only in infra (and platform); the MCP
#                           SDK also in http
#   modules-via-index       another module is imported only by its root package; a module's http
#                           layer may also import its OWN root (the session guards, the principal),
#                           which does not make a cycle: a root never imports its http or infra
#   migrations-only-platform  apps/server/migrations (the embedded SQL files) is imported only by
#                           the composition (platform) and the test-support package pgtest
#   platform-leaves         the leaves platform-{httpx,outbox,logging,db} (internal/platform/...) are
#                           what a module's http and infra layers may import from platform; domain
#                           and app never; the leaves import neither modules nor the composition
#   layer-self-dependency   every layer lists itself: an external test package (package domain_test)
#                           imports the package it tests; this opens no other layer
#
# Platform components: the leaves (httpx, outbox, logging, db), migrate and pgtest (support) and
# `platform`, the composition (everything else in internal/platform), which may depend on anything.
# The components do not overlap; a package of internal/platform that no component lists is reported
# by go-arch-lint, so a new one has to be classified.
version: 3
workdir: internal
allow:
  depOnAnyVendor: false
  # Off on purpose: the deep scan treats the concrete argument passed to an interface parameter as
  # a dependency of the callee's package, which forbids dependency inversion itself. Pinned by
  # TestInjectingAnAdapterIntoAPortIsAllowed.
  deepScan: false

# The architecture tests are not part of the layered code (their fixtures are deliberately wrong).
exclude:
  - archtest

vendors:
  pgx:
    in: github.com/jackc/pgx/**
  go-oidc:
    in: github.com/coreos/go-oidc/**
  x-oauth2:
    in:
      - golang.org/x/oauth2
      - golang.org/x/oauth2/**
  onnx:
    in: github.com/yalue/onnxruntime_go
  mcp-sdk:
    in: github.com/modelcontextprotocol/go-sdk/**
  testcontainers:
    in: github.com/testcontainers/**

components:
  kernel:
    in: kernel/**
  # The composition: wires modules and leaves, owns config, the lifecycle, the audit and secret
  # box implementations and the scheduler. May depend on anything.
  platform:
    in:
      - platform
      - platform/app/**
      - platform/audit/**
      - platform/config/**
      - platform/crypto/**
      - platform/scheduler/**
  # Leaves: what a module's http and infra layers may import (see deps below).
  platform-httpx:
    in: platform/httpx/**
  platform-outbox:
    in: platform/outbox/**
  platform-logging:
    in: platform/logging/**
  platform-db:
    in: platform/db/**
  # Support, not leaves: the migration runner, and the throwaway migrated Postgres (pgtest) that
  # the tests of leaves and of infra layers use. No module layer imports migrate.
  platform-migrate:
    in: platform/migrate/**
  platform-pgtest:
    in: platform/pgtest/**
  # The embedded SQL files live with the TypeScript server's migrations (one source of truth);
  # only platform (internal/platform/migrate's caller, the composition root) and pgtest import them.
  migrations:
    in: ../apps/server/migrations
  identity-root:
    in: modules/identity
  identity-domain:
    in: modules/identity/domain/**
  identity-app:
    in: modules/identity/app/**
  identity-infra:
    in: modules/identity/infra/**
  identity-http:
    in: modules/identity/http/**
  catalog-root:
    in: modules/catalog
  catalog-domain:
    in: modules/catalog/domain/**
  catalog-app:
    in: modules/catalog/app/**
  catalog-infra:
    in: modules/catalog/infra/**
  catalog-http:
    in: modules/catalog/http/**
  connections-root:
    in: modules/connections
  connections-domain:
    in: modules/connections/domain/**
  connections-app:
    in: modules/connections/app/**
  connections-infra:
    in: modules/connections/infra/**
  connections-http:
    in: modules/connections/http/**
  search-root:
    in: modules/search
  search-domain:
    in: modules/search/domain/**
  search-app:
    in: modules/search/app/**
  search-infra:
    in: modules/search/infra/**
  search-http:
    in: modules/search/http/**
  gateway-root:
    in: modules/gateway
  gateway-domain:
    in: modules/gateway/domain/**
  gateway-app:
    in: modules/gateway/app/**
  gateway-infra:
    in: modules/gateway/infra/**
  gateway-http:
    in: modules/gateway/http/**

commonComponents:
  - kernel

deps:
  platform:
    anyProjectDeps: true
    anyVendorDeps: true
  # Leaves import kernel (a common component) and the leaves named here, nothing of modules/** and
  # nothing of the composition. The vendors are the ones the code uses today.
  platform-logging:
    mayDependOn:
      - platform-logging
  platform-httpx:
    mayDependOn:
      - platform-httpx
      - platform-logging
      - platform-pgtest
    canUse:
      - pgx
  platform-outbox:
    mayDependOn:
      - platform-outbox
      - platform-logging
      - platform-pgtest
    canUse:
      - pgx
  platform-db:
    mayDependOn:
      - platform-db
      - platform-pgtest
    canUse:
      - pgx
  platform-migrate:
    mayDependOn:
      - platform-migrate
      - platform-db
      - platform-pgtest
      - migrations
    canUse:
      - pgx
  platform-pgtest:
    mayDependOn:
      - platform-pgtest
      - platform-migrate
      - migrations
    canUse:
      - pgx
      - testcontainers
  identity-root:
    mayDependOn:
      - identity-root
      - identity-domain
      - identity-app
      - platform-httpx
  identity-domain:
    mayDependOn:
      - identity-domain
  identity-app:
    mayDependOn:
      - identity-app
      - identity-domain
      - catalog-root
      - connections-root
      - search-root
      - gateway-root
  identity-infra:
    mayDependOn:
      - identity-infra
      - identity-domain
      - identity-app
      - catalog-root
      - connections-root
      - search-root
      - gateway-root
      - platform-outbox
      - platform-db
      - platform-logging
      - platform-pgtest
    canUse:
      - pgx
      - go-oidc
      - x-oauth2
      - onnx
      - mcp-sdk
  identity-http:
    mayDependOn:
      - identity-http
      - identity-domain
      - identity-app
      - identity-root
      - catalog-root
      - connections-root
      - search-root
      - gateway-root
      - platform-httpx
      - platform-logging
    canUse:
      - mcp-sdk
  catalog-root:
    mayDependOn:
      - catalog-root
      - catalog-domain
      - catalog-app
      - platform-httpx
  catalog-domain:
    mayDependOn:
      - catalog-domain
  catalog-app:
    mayDependOn:
      - catalog-app
      - catalog-domain
      - identity-root
      - connections-root
      - search-root
      - gateway-root
  catalog-infra:
    mayDependOn:
      - catalog-infra
      - catalog-domain
      - catalog-app
      - identity-root
      - connections-root
      - search-root
      - gateway-root
      - platform-outbox
      - platform-db
      - platform-logging
      - platform-pgtest
    canUse:
      - pgx
      - go-oidc
      - x-oauth2
      - onnx
      - mcp-sdk
  catalog-http:
    mayDependOn:
      - catalog-http
      - catalog-domain
      - catalog-app
      - catalog-root
      - identity-root
      - connections-root
      - search-root
      - gateway-root
      - platform-httpx
      - platform-logging
    canUse:
      - mcp-sdk
  connections-root:
    mayDependOn:
      - connections-root
      - connections-domain
      - connections-app
      - platform-httpx
  connections-domain:
    mayDependOn:
      - connections-domain
  connections-app:
    mayDependOn:
      - connections-app
      - connections-domain
      - identity-root
      - catalog-root
      - search-root
      - gateway-root
  connections-infra:
    mayDependOn:
      - connections-infra
      - connections-domain
      - connections-app
      - identity-root
      - catalog-root
      - search-root
      - gateway-root
      - platform-outbox
      - platform-db
      - platform-logging
      - platform-pgtest
    canUse:
      - pgx
      - go-oidc
      - x-oauth2
      - onnx
      - mcp-sdk
  connections-http:
    mayDependOn:
      - connections-http
      - connections-domain
      - connections-app
      - connections-root
      - identity-root
      - catalog-root
      - search-root
      - gateway-root
      - platform-httpx
      - platform-logging
    canUse:
      - mcp-sdk
  search-root:
    mayDependOn:
      - search-root
      - search-domain
      - search-app
      - platform-httpx
  search-domain:
    mayDependOn:
      - search-domain
  search-app:
    mayDependOn:
      - search-app
      - search-domain
      - identity-root
      - catalog-root
      - connections-root
      - gateway-root
  search-infra:
    mayDependOn:
