version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The runtime is Node 22 (Dockerfile, CI); newer typings would allow APIs it lacks.
      # Bump together with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
