# Records compat/golden/search-<arch>.json on a native runner of that architecture, against the
# image built from this tree (the TypeScript reference), and uploads it as an artifact. Nothing is
# committed: the owner downloads the artifact and commits the file. Run it manually:
#   gh workflow run compat-record
# Only the test that owns the search golden runs (make compat-record-search), so no other golden
# is rewritten.
name: compat-record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: record search golden (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make compat-image-ts
      - run: make compat-record-search
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-${{ matrix.arch }}
          path: compat/golden/search-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14
