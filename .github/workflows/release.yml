# Release: on a v* tag, build the Docker image natively on each architecture, test it there, and only
# then push it to GHCR as ghcr.io/<owner>/<repo> for linux/amd64 and linux/arm64 with semver tags
# (1.2.3, 1.2, 1, latest). Nothing is pushed before, on BOTH architectures, the version check, the
# ancestry check, the version printed by the image and both smoke tests (quick start and compose) have
# passed. No emulation anywhere: amd64 builds and runs on ubuntu-latest, arm64 on ubuntu-24.04-arm (no
# QEMU, no --platform; compat/release_workflow_test.go, run by make go-verify, keeps it so).
# Jobs:
#   test (matrix, contents: read, every event): checks, the candidate built and loaded into the local
#     Docker, its --version, both smokes against it, then its layers (rootfs diff_ids) as a job output.
#   push-digest (same matrix, tag push only, packages: write): rebuilds the candidate on the same
#     kind of runner from the cache scope the test leg exported, pushes it by digest (no tag) and
#     fails unless the pushed image has exactly the tested layers.
#   publish (tag push only, packages: write): merges the two digests into one manifest list under the
#     semver tags and fails unless every tag points at a list of exactly those two images.
#   assemble (every event except a tag push, contents: read): the rehearsal's dry assembly.
# Only push-digest and publish have packages: write, and they run only on a tag push.
# Any event other than a tag push is a rehearsal: a manual run (workflow_dispatch, any branch) or a
# pull request that touches the release path. It builds and tests everything on both architectures,
# the version check only needs a non-empty version, the ancestry check is skipped and the manifest
# list is assembled with --dry-run from the published reference image instead of pushed. A rehearsal
# never reads a secret, has no write permission and can never publish, so it also works for pull
# requests from forks.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Files the image build, the two smoke tests and the checks depend on that ci.yml does not exercise
  # in this form (ci.yml builds and smokes the image for code changes, so apps/** is not listed).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - quickstart.compose.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - migrations/**
      - third_party/**
      - compat/cmd/**
      - LICENSE
      - THIRD_PARTY_NOTICES
      - scripts/quickstart-smoke.sh
      - scripts/smoke.sh
      - scripts/smoke.compose.yml
      - scripts/smoke.prebuilt.compose.yml
      - scripts/check-release-version.mjs
      - scripts/check-release-manifest.sh
      - VERSION
      - CHANGELOG.md

permissions:
  contents: read

# A newer push to the same pull request cancels the older rehearsal; a tag release is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# bash with -o pipefail in every run step: a failed command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # How the operator CLI is invoked inside the image (the `runtime` target of the Dockerfile): the
  # --version step and both smoke tests (SMOKE_CLI, QUICKSTART_CLI) use it, nothing else names it.
  IMAGE_CLI: mcp-registry

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    # One output per architecture, each set only by its own leg (a matrix leg leaves the other's empty).
    outputs:
      layers_amd64: ${{ steps.tested.outputs.layers_amd64 }}
      layers_arm64: ${{ steps.tested.outputs.layers_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No token in .git/config for the scripts and the builds.
          persist-credentials: false
      # For scripts/check-release-version.mjs (the image builds and the smoke tests need no Node).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the tag matches the version and the changelog
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$TAG"
      - name: Rehearsal, check the version is set
        if: github.event_name != 'push'
        run: node scripts/check-release-version.mjs --rehearsal
      # Would a tag pushed now be accepted? Warns, never fails (the strict check runs on the tag).
      - name: Rehearsal, strict check for the would-be tag (warning only)
        if: github.event_name != 'push'
        run: |
          version="$(node scripts/check-release-version.mjs --rehearsal)"
          if msg="$(node scripts/check-release-version.mjs "v$version" 2>&1)"; then
            echo "a tag v$version pushed now would pass the version check"
          else
            echo "::warning::a tag v$version pushed now would be refused: $msg"
          fi
      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        # The repository is public: an anonymous fetch is enough, no stored credentials needed.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::the tagged commit is not an ancestor of origin/main"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The candidate: this runner's own platform, loaded into the local Docker, not pushed. Each
      # architecture has its own cache scope (one scope would make one export overwrite the other's
      # index); push-digest rebuilds from it. A cache-service error does not fail the build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: mcp-registry:rc
          cache-from: type=gha,scope=rc-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=rc-${{ matrix.arch }},ignore-error=true
      - name: The image prints the version from the VERSION file
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          read -r -a cli <<<"$IMAGE_CLI"
          expected="$(tr -d '[:space:]' < VERSION)"
          actual="$(docker run --rm mcp-registry:rc "${cli[@]}" --version)"
          os_arch="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' mcp-registry:rc)"
          echo "expected=$expected actual=$actual platform=$os_arch"
          [ -n "$expected" ] && [ "$actual" = "$expected" ] && [ "$os_arch" = "linux/$ARCH" ]
      # Prebuilt-image mode: nothing is built for the app and the image is not removed (the test
      # upstream and the Go MCP client of smoke.sh are built from this tree, target smoke-go).
      - name: Smoke test, quick start (prebuilt image)
        run: QUICKSTART_IMAGE=mcp-registry:rc QUICKSTART_CLI="$IMAGE_CLI" bash scripts/quickstart-smoke.sh
      - name: Smoke test, docker compose (prebuilt image)
        run: SMOKE_IMAGE=mcp-registry:rc SMOKE_CLI="$IMAGE_CLI" bash scripts/smoke.sh
      # Last, so only a leg that passed everything records what it tested: the uncompressed layer
      # digests, which push-digest compares with the image it pushes.
      - name: Record the tested layers
        id: tested
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          layers="$(docker image inspect --format '{{json .RootFS.Layers}}' mcp-registry:rc | jq -c .)"
          jq -e 'type == "array" and length > 0 and all(.[]; test("^sha256:[0-9a-f]{64}$"))' <<<"$layers" >/dev/null ||
            { echo "::error::no layer digests for mcp-registry:rc"; exit 1; }
          echo "tested layers ($ARCH): $layers"
          echo "layers_$ARCH=$layers" >> "$GITHUB_OUTPUT"

  # Only now the registry is touched, and only for a tag push. Each architecture is rebuilt on its
  # own kind of runner from the same commit, Dockerfile and target, with the cache scope its test leg
  # exported, and pushed by digest only (no tag yet). The base images are pinned by digest and the
  # other inputs too (lockfiles, checksums of the model and the native libraries), and the step after
  # the push refuses an image whose layers are not exactly the tested ones, so a cache miss (an
  # evicted or failed export, which ignore-error hides) that rebuilds a layer differently stops the
  # release instead of publishing an untested image: re-run all jobs then.
  push-digest:
    needs: test
    if: github.event_name == 'push'
    name: push-digest (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest_amd64: ${{ steps.pushed.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.pushed.outputs.digest_arm64 }}
      manifest_amd64: ${{ steps.pushed.outputs.manifest_amd64 }}
      manifest_arm64: ${{ steps.pushed.outputs.manifest_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The OCI labels of the image (the tags are set by publish).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Push the image by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=rc-${{ matrix.arch }}
      - name: The pushed image has exactly the tested layers
        id: pushed
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TESTED: ${{ needs.test.outputs[format('layers_{0}', matrix.arch)] }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the push ($DIGEST)"; exit 1; }
          [ -n "$TESTED" ] || { echo "::error::the test job recorded no layers for $ARCH"; exit 1; }
          # The push is an index (the image and its attestation) or the image manifest itself.
          raw="$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")"
          manifest="$(jq -r --arg arch "$ARCH" '
            if .manifests then
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch
                and ((.annotations // {})["vnd.docker.reference.type"] != "attestation-manifest"))]
              | if length == 1 then .[0].digest else error("\(length) linux/\($arch) images in the push") end
            else empty end' <<<"$raw")"
          [ -n "$manifest" ] || manifest="$DIGEST"
          config="$(docker buildx imagetools inspect --format '{{json .Image}}' "$IMAGE@$manifest")"
          pushed="$(jq -c '.rootfs.diff_ids' <<<"$config")"
          platform="$(jq -r '"\(.os)/\(.architecture)"' <<<"$config")"
          echo "pushed $IMAGE@$DIGEST (linux/$ARCH manifest $manifest, platform $platform)"
          echo "tested layers: $TESTED"
          echo "pushed layers: $pushed"
          [ "$platform" = "linux/$ARCH" ] || { echo "::error::the pushed image is $platform, want linux/$ARCH"; exit 1; }
          [ "$pushed" = "$TESTED" ] ||
            { echo "::error::the pushed linux/$ARCH image is not the tested one (a cache miss rebuilt a layer); re-run all jobs"; exit 1; }
          {
            echo "digest_$ARCH=$DIGEST"
            echo "manifest_$ARCH=$manifest"
          } >> "$GITHUB_OUTPUT"

  # One manifest list over the two pushed digests, under every semver tag; then each tag must name a
  # list of exactly the two images push-digest pushed and checked.
  publish:
    needs: [test, push-digest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Merge the two digests into one manifest list under the tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST_AMD64: ${{ needs.push-digest.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ needs.push-digest.outputs.digest_arm64 }}
        run: |
          [[ "$DIGEST_AMD64" =~ ^sha256:[0-9a-f]{64}$ && "$DIGEST_ARM64" =~ ^sha256:[0-9a-f]{64}$ ]] ||
            { echo "::error::missing digests (amd64 '$DIGEST_AMD64', arm64 '$DIGEST_ARM64')"; exit 1; }
          args=()
          while IFS= read -r tag; do [ -z "$tag" ] || args+=(-t "$tag"); done <<<"$TAGS"
          [ "${#args[@]}" -gt 0 ] || { echo "::error::no tags to publish"; exit 1; }
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST_AMD64" "$IMAGE@$DIGEST_ARM64"
      - name: Every tag names a list of exactly the two pushed images
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          MANIFEST_AMD64: ${{ needs.push-digest.outputs.manifest_amd64 }}
          MANIFEST_ARM64: ${{ needs.push-digest.outputs.manifest_arm64 }}
        run: |
          first=""
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$tag" | jq -r .digest)"
            echo "$tag -> $digest"
            docker buildx imagetools inspect --raw "$tag" | bash scripts/check-release-manifest.sh "$MANIFEST_AMD64" "$MANIFEST_ARM64"
            [ -n "$first" ] || first="$digest"
            [ "$digest" = "$first" ] || { echo "::error::$tag names $digest, the first tag $first"; exit 1; }
          done <<<"$TAGS"
          [ -n "$first" ] || { echo "::error::no tag was checked"; exit 1; }

  # Rehearsal only: the parts of publishing that need no registry write. The test job's per-architecture
  # outputs arrive (what push-digest compares with), and a manifest list is assembled with --dry-run
  # (nothing is written) from the two platform images of the published reference image, pinned by
  # digest in the Makefile (public, read anonymously: no secret, works for forks), then judged by the
  # same check publish runs on every tag, which must also refuse the two digests swapped.
  assemble:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: The test job recorded the layers of both architectures
        env:
          LAYERS_AMD64: ${{ needs.test.outputs.layers_amd64 }}
          LAYERS_ARM64: ${{ needs.test.outputs.layers_arm64 }}
        run: |
          for layers in "$LAYERS_AMD64" "$LAYERS_ARM64"; do
            jq -e 'type == "array" and length > 0' <<<"$layers" >/dev/null ||
              { echo "::error::a test leg recorded no layers ('$layers')"; exit 1; }
          done
          echo "amd64: $LAYERS_AMD64"
          echo "arm64: $LAYERS_ARM64"
      - name: Dry assembly of a manifest list from the reference image
        run: |
          ref="$(make -s print-reference-image)"
          repo="${ref%@*}"
          repo="${repo%:*}"
          raw="$(docker buildx imagetools inspect --raw "$ref")"
          pick() { jq -r --arg arch "$1" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else error("not one linux/\($arch) image") end' <<<"$raw"; }
          amd64="$(pick amd64)"
          arm64="$(pick arm64)"
          docker buildx imagetools create --dry-run -t "$repo:rehearsal" "$repo@$amd64" "$repo@$arm64" > "$RUNNER_TEMP/index.json"
          bash scripts/check-release-manifest.sh "$amd64" "$arm64" < "$RUNNER_TEMP/index.json"
          if bash scripts/check-release-manifest.sh "$arm64" "$amd64" < "$RUNNER_TEMP/index.json" 2>/dev/null; then
            echo "::error::the manifest check accepted swapped digests"
            exit 1
          fi
