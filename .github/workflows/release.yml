# Release: on a v* tag, build the Docker image, test it, and only then push it to GHCR as
# ghcr.io/<owner>/<repo> for linux/amd64 and linux/arm64 with semver tags (1.2.3, 1.2, 1, latest).
# Nothing is pushed before the version check, the ancestry check, the version printed by the
# amd64 and arm64 images and both smoke tests (quick start and compose) have passed.
# Two jobs: `test` (contents: read only, every event) and `publish` (tag push only, the only job
# with packages: write).
# Any event other than a tag push is a rehearsal: a manual run (workflow_dispatch, any branch) or a
# pull request that touches the release path. It builds and tests everything, the version check only
# needs a non-empty version, the ancestry check is skipped and a multi-arch build runs with
# push: false. A rehearsal never reads a secret, has no write permission and can never publish, so
# it also works for pull requests from forks.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Files the image build and the two smoke tests depend on that ci.yml does not exercise in this
  # form (ci.yml builds and smokes the image for code changes, so apps/** is not listed).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - .dockerignore
      - docker-compose.yml
      - quickstart.compose.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/quickstart-smoke.sh
      - scripts/smoke.sh
      - scripts/smoke.compose.yml
      - scripts/smoke.prebuilt.compose.yml
      - scripts/check-release-version.mjs
      - scripts/download-model.mjs

permissions:
  contents: read

# A newer push to the same pull request cancels the older rehearsal; a tag release is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No token with packages: write in .git/config for pnpm install and the scripts.
          persist-credentials: false
      - name: Check the tag matches the version and the changelog
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$TAG"
      - name: Rehearsal, check the version is set
        if: github.event_name != 'push'
        run: node scripts/check-release-version.mjs --rehearsal
      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        # The repository is public: an anonymous fetch is enough, no stored credentials needed.
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "::error::the tagged commit is not an ancestor of origin/main"; exit 1; }
      # The smoke tests need pnpm and node_modules (the MCP client of scripts/smoke.sh).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The candidate: linux/amd64 only, loaded into the local Docker, not pushed.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          push: false
          tags: mcp-registry:rc
          cache-from: type=gha,scope=rc-amd64
          cache-to: type=gha,mode=max,scope=rc-amd64,ignore-error=true
      - name: The image prints the version from apps/server/package.json
        run: |
          expected="$(node -p "require('./apps/server/package.json').version")"
          actual="$(docker run --rm mcp-registry:rc node dist/cli.js --version)"
          echo "expected=$expected actual=$actual"
          [ -n "$expected" ] && [ "$actual" = "$expected" ]
      - name: Smoke test, quick start (prebuilt image)
        env:
          QUICKSTART_IMAGE: mcp-registry:rc
        run: bash scripts/quickstart-smoke.sh
      - name: Smoke test, docker compose (prebuilt image)
        env:
          SMOKE_IMAGE: mcp-registry:rc
        run: bash scripts/smoke.sh
      # The second platform is built into a separate tag (the docker driver keeps one image per
      # tag) and run under QEMU. Each build has its own cache scope: one scope would make the
      # arm64 export overwrite the amd64 index. A cache-service error does not fail the build.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          load: true
          push: false
          tags: mcp-registry:rc-arm64
          cache-from: type=gha,scope=rc-arm64
          cache-to: type=gha,mode=max,scope=rc-arm64,ignore-error=true
      - name: The arm64 image prints the same version
        run: |
          expected="$(node -p "require('./apps/server/package.json').version")"
          actual="$(docker run --rm --platform linux/arm64 mcp-registry:rc-arm64 node dist/cli.js --version)"
          echo "expected=$expected actual=$actual"
          [ -n "$expected" ] && [ "$actual" = "$expected" ]
      - name: Rehearsal, multi-arch build without pushing
        if: github.event_name != 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: |
            type=gha,scope=rc-amd64
            type=gha,scope=rc-arm64
          cache-to: type=gha,mode=max,scope=rc-publish,ignore-error=true

  # Only now the registry is touched, and only for a tag push. The image is rebuilt from the cache
  # scopes the test job exported (a cache miss only makes it slower).
  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Push the multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=rc-amd64
            type=gha,scope=rc-arm64
          cache-to: type=gha,mode=max,scope=rc-publish,ignore-error=true
