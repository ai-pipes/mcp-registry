# Proves that the compat suite can fail: it runs named scenarios against the reference image (the
# published 1.0.1, which carries the Node the proxy runs on) behind a proxy that applies one
# distortion at a time (compat/selfcheck) and requires each to fail, with a transparent proxy as the
# control. Slow, so daily and on demand, not on pull requests.
name: compat-selfcheck

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compat-selfcheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfcheck:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pulls the reference (the published 1.0.1, pinned by digest), builds the derived image from it,
      # then runs every distortion.
      - run: make compat-selfcheck
        env:
          COMPAT_LOG_DIR: ${{ runner.temp }}/compat-logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-selfcheck-logs
          path: ${{ runner.temp }}/compat-logs
          if-no-files-found: ignore
          retention-days: 7
