# CI: verify (lint, types, architecture, knip, unit + integration tests on Testcontainers),
# smoke (the docker compose box end to end), quickstart (quickstart.compose.yml from stdin) and e2e
# (Playwright in Chromium against the same built image; all three engines nightly in
# e2e-browsers.yml), go (the Go rewrite's lint, architecture rules and unit tests) and compat (the Go
# black-box suite against the image built from this tree, on amd64 and arm64; its self-check runs
# daily in compat-selfcheck.yml and the amd64 search golden is recorded by compat-record.yml).
#
# Moving to another CI inside the perimeter: the same two commands on a runner with
# Node 22, pnpm (version from package.json) and Docker, after `pnpm install --frozen-lockfile`:
#   pnpm audit --audit-level=high && pnpm verify
#   bash scripts/smoke.sh
#   bash scripts/quickstart-smoke.sh
#   pnpm exec playwright install --with-deps chromium && bash scripts/e2e-image.sh
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0, version from packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      # Docker is available on ubuntu runners, so the Testcontainers integration tests run.
      - run: pnpm verify
      # The Go compat suite validates REST responses with JSON Schemas generated from the zod contracts.
      - run: make compat-schemas && git diff --exit-code compat/schemas && test -z "$(git status --porcelain compat/schemas)"

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/smoke.sh

  quickstart:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/quickstart-smoke.sh

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/e2e-image.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: node_modules/.cache/playwright/test-results
          retention-days: 7

  # `make go-verify`: golangci-lint, go-arch-lint, go vet (also with the compat tags) and go test.
  # Node is needed only because the Makefile reads the version from apps/server/package.json; no
  # pnpm install is involved.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make go-verify

  # The Go compatibility suite (compat/, tag compat) against the image built from this tree, on both
  # architectures. The embeddings and search goldens are per architecture: the amd64 search golden
  # (compat/golden/search-amd64.json) has to be recorded on an amd64 runner first (compat-record.yml,
  # then commit the file); until it exists the amd64 entry only reports that with a notice instead of
  # running a suite that cannot pass. arm64 always runs.
  compat:
    needs: [go]
    name: compat (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `if: hashFiles(...)` does not exist at job level, so the condition is a step whose output
      # gates the steps below. No continue-on-error anywhere: a skipped entry is skipped openly.
      - name: Decide whether this architecture can run the suite
        id: gate
        run: |
          if [ "${{ matrix.arch }}" = amd64 ] && [ ! -f compat/golden/search-amd64.json ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::compat (amd64) did not run: compat/golden/search-amd64.json has not been recorded yet. Run the compat-record workflow, then commit the artifact it uploads."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: steps.gate.outputs.run == 'true'
        run: make compat-image-ts
      - if: steps.gate.outputs.run == 'true'
        run: make compat
        env:
          COMPAT_LOG_DIR: ${{ runner.temp }}/compat-logs
      # The harness writes the app container's log of every failed stack (secrets removed) there.
      - if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-app-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/compat-logs
          if-no-files-found: ignore
          retention-days: 7
