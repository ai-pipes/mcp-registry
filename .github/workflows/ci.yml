# CI: verify (lint, types, architecture, knip, unit + integration tests on Testcontainers),
# smoke (the docker compose box end to end), quickstart (quickstart.compose.yml from stdin) and e2e
# (Playwright in Chromium against the same built image; all three engines nightly in
# e2e-browsers.yml), go (the Go rewrite's lint, architecture rules and unit tests) and compat (the Go
# black-box suite against the reference, the published 1.0.1 pinned by digest, on amd64 and arm64; its
# self-check runs daily in compat-selfcheck.yml) and
# e2e-flows (the browser flows of the web UI, e2e/flows, against that same image, orchestrated by Go);
# compat-go and e2e-flows-go run the milestone pattern of the Go server (not required checks).
#
# Moving to another CI inside the perimeter: the same two commands on a runner with
# Node 22, pnpm (version from package.json) and Docker, after `pnpm install --frozen-lockfile`:
#   pnpm audit --audit-level=high && pnpm verify
#   bash scripts/smoke.sh
#   bash scripts/quickstart-smoke.sh
#   pnpm exec playwright install --with-deps chromium && bash scripts/e2e-image.sh
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.0, version from packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      # Docker is available on ubuntu runners, so the Testcontainers integration tests run.
      - run: pnpm verify
      # The Go compat suite validates REST responses with JSON Schemas generated from the zod contracts.
      - run: make compat-schemas && git diff --exit-code compat/schemas && test -z "$(git status --porcelain compat/schemas)"

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/smoke.sh

  quickstart:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/quickstart-smoke.sh

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: bash scripts/e2e-image.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: node_modules/.cache/playwright/test-results
          retention-days: 7

  # `make go-verify`: golangci-lint, go-arch-lint, go vet (also with the compat tags) and go test.
  # The version (VERSION) and the model fetch no longer use Node; the Node setup stays installed for
  # now (no pnpm install is involved) and may go in a later CI cleanup.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make go-verify

  # The code behind the build tag onnx (the local embedder: cgo and the pinned ONNX Runtime library)
  # is not part of make go-verify, which needs no native library. It is vetted, linted and tested
  # here on both architectures: the unit tests compare token ids with files recorded from the
  # reference and check the arithmetic; no vector is recorded (vectors depend on the CPU), vector
  # parity is judged by the compat job (make go-test-onnx-parity and TestSearchStoredVectors).
  # make native-libs downloads the pinned libraries and checks their SHA-256 (make go-verify-onnx needs them too; a separate step shows a failed download on its own).
  go-onnx:
    name: go-onnx (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Neither the version (VERSION) nor make native-model use Node any more; the setup stays for now.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: make native-libs
      - run: make go-verify-onnx

  # The compatibility suite (compat/, tag compat) against the image built from this tree (make
  # compat-image: the image a release ships) with every decided deviation, on both architectures,
  # each building the image natively on its own runner. The reference (the published 1.0.1, make
  # compat-reference) is pulled too: some scenarios compare with it on the same machine (the stored
  # vectors and the recorded rankings must be equal on arm64 and on amd64) and the database hand-over
  # scenarios start from it. So is the published 1.0.0 (UPGRADE_FROM_IMAGE in the Makefile): the upgrade
  # scenario starts from it, hands its database to the image under test and rotates the key.
  compat:
    needs: [go]
    name: compat (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make compat-reference
      - run: make compat-upgrade-from
      - run: make compat-image
      # The embedder's vectors against the reference image's, in containers of this runner's architecture
      # (the Go dependencies are fetched first: the container has no network).
      - run: go mod download
      - run: make go-test-onnx-parity
      - run: make compat
        env:
          COMPAT_LOG_DIR: ${{ runner.temp }}/compat-logs
      # The harness writes the app container's log of every failed stack (secrets removed) there.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-app-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/compat-logs
          if-no-files-found: ignore
          retention-days: 7

  # The reference leg: the same suite with the published 1.0.1 (pinned by digest) as the image under
  # test (make compat-reference-run sets its CLI, an empty COMPAT_FIXED and the upgrade source with
  # its CLI), so every reference branch of the decided deviations stays asserted, the upgrade from
  # the published 1.0.0 runs too, and the vector and ranking comparisons are determinism checks. On
  # both architectures.
  compat-reference:
    needs: [go]
    name: compat-reference (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make compat-reference
      - run: make compat-upgrade-from
      - run: make compat-reference-run
        env:
          COMPAT_LOG_DIR: ${{ runner.temp }}/compat-logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compat-reference-app-logs-${{ matrix.arch }}
          path: ${{ runner.temp }}/compat-logs
          if-no-files-found: ignore
          retention-days: 7

  # The browser flows of the web UI (e2e/flows, Playwright with Chromium) against the image built from
  # this tree (make compat-image) with every decided deviation, orchestrated from Go (compat/e2e, tags
  # compat and e2e), plus the control API's own tests. Separate from the `e2e` job above, which runs
  # e2e/csp.spec.ts against the compose box. arm64 only.
  e2e-flows:
    needs: [go]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: make compat-image
      - run: make e2e-flows
        env:
          COMPAT_LOG_DIR: ${{ runner.temp }}/compat-logs
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e-flows-results
      # Traces and screenshots of the failed flows, and the app log of every failed stack (secrets removed).
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-flows-results
          path: |
            ${{ runner.temp }}/e2e-flows-results
            ${{ runner.temp }}/compat-logs
          if-no-files-found: ignore
          retention-days: 7
